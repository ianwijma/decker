name: CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Linux build, runtime and packaged desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Native modules under Electron
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron scripts/native-smoke.cjs
      - name: Build Debian and AppImage distributions
        run: npm run package
      - name: Packaged native modules
        run: ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/decker scripts/native-smoke.cjs dist/linux-unpacked/resources/app.asar/package.json
      - name: Packaged desktop interactions
        run: xvfb-run -a npm run test:e2e
        env:
          DECKER_EXECUTABLE: ./dist/linux-unpacked/decker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
